[project]
name = "llm-observe-api"
version = "0.1.0"
description = "Ingest and query API for llm-observe"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# N811 reads `from sqlalchemy.dialects.postgresql import UUID as PgUUID` as a
# constant renamed to a non-constant. It is a type, and PgUUID is the spelling
# SQLAlchemy's own documentation uses to disambiguate it from uuid.UUID.
ignore = ["N811"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Each test gets its own event loop, and conftest disposes the app engine after
# every test to match. Without that pairing, a pooled connection created on one
# loop is reused on the next and asyncpg raises a cross-loop error.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
